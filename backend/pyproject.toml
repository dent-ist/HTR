[project]
name = "htr-backend"
version = "0.1.0"
description = "Local-first handwritten text recognition tool (backend)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "kraken==7.1.1",
    "fastapi",
    "uvicorn",
    "pillow",
    "numpy",
    "scipy",
    "shapely",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.uv]
# Pascal (GTX 1050 Ti, sm_61): the CUDA 12.6 wheels still ship sm_61 kernels;
# newer CUDA builds (12.8+) drop them.
default-groups = ["dev"]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not kraken and not train'"
markers = [
    "kraken: runs the real Kraken model (slow); select with -m kraken",
    "train: tiny real fine-tune + predict with Kraken (needs `make base-model`); select with -m train",
]
pythonpath = [".", "../scripts"]
